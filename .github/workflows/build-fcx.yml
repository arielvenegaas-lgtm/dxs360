name: build-fcx (genuine XEX bring-up)

# Builds a genuine Xbox 360 .xex with FreeChainXenon (the free/libre 360 SDK):
# binutils + first-stage gcc + SynthXEX, all from source. This is the ONLY open
# toolchain that emits a real XEX2. It has no graphics/input API yet, so this
# artifact is a bring-up: it boots under the 360 OS and paints a code to prove
# execution. See README.md.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-fcx-xex:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore FreeChainXenon toolchain cache
        id: cache-fcx
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.fcx
          key: fcx-toolchain-${{ runner.os }}-v1

      - name: Install build dependencies
        if: steps.cache-fcx.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential flex bison gcc-multilib cmake git wget file rename \
            libgmp-dev libmpfr-dev libmpc-dev libisl-dev texinfo nettle-dev

      - name: Build FreeChainXenon toolchain
        if: steps.cache-fcx.outputs.cache-hit != 'true'
        run: |
          set -eux
          # The canonical host (git.aidenisik.scot) is mirrored on GitHub; use
          # the mirror so the build is reachable from CI.
          git config --global \
            url."https://github.com/FreeChainXenon/".insteadOf \
            "https://git.aidenisik.scot/FreeChainXenon/"
          rm -rf "$RUNNER_TEMP/fcxbuild"
          mkdir -p "$RUNNER_TEMP/fcxbuild"
          cd "$RUNNER_TEMP/fcxbuild"
          curl -fsSL -o build-fcx-toolchain \
            "https://raw.githubusercontent.com/FreeChainXenon/FCX-Installer/main/build-fcx-toolchain"
          # Point the optional library prefixes at the system prefix instead of
          # the author's /opt/local.
          sed -i 's#/opt/local#/usr#g' build-fcx-toolchain
          # fcx/build.sh links with -nostdlib, so newlib is not needed - only
          # binutils, the first-stage GCC, SynthXEX and the support files are.
          # newlib 4.5.0 also currently ICEs GCC 14.2 on this target
          # (libm/math/e_fmod.c: "unrecognizable insn"), so drop the newlib and
          # second-GCC-pass blocks, keeping the SynthXEX + support-file steps.
          sed -i '/[Bb]uild newlib/,/[Bb]uild SynthXEX/{/[Bb]uild SynthXEX/!d}' build-fcx-toolchain
          chmod +x build-fcx-toolchain
          export PREFIX="$GITHUB_WORKSPACE/.fcx"
          ./build-fcx-toolchain toolchain
          echo "== toolchain =="
          ls -la "$PREFIX/bin" | head -40

      - name: Check toolchain is present
        run: |
          set -e
          PREFIX="$GITHUB_WORKSPACE/.fcx"
          test -d "$PREFIX/ldscripts"
          test -d "$PREFIX/elfloader"
          "$PREFIX/bin/powerpc64-fcx-xenon-gcc" --version
          ls "$PREFIX/bin/synthxex"

      - name: Build bring-up XEX
        run: |
          set -eux
          export FREECHAINXENON="$GITHUB_WORKSPACE/.fcx"
          export PATH="$FREECHAINXENON/bin:$FREECHAINXENON/usr/bin:$PATH"
          cd fcx
          sh ./build.sh
          ls -l AuroraBricks.elf AuroraBricks.exe AuroraBricks.xex

      - name: Verify it is a genuine XEX2 (and embeds a PPC ELF)
        run: |
          set -e
          BIN=fcx/AuroraBricks.xex
          python3 ci/verify_xex.py "$BIN"
          file "$BIN" || true

      - name: Package Aurora bundle
        run: |
          set -e
          mkdir -p dist/AuroraBricks-XEX-Bringup
          cp fcx/AuroraBricks.xex dist/AuroraBricks-XEX-Bringup/default.xex
          cp packaging/AuroraBricks-XEX-Bringup-READ_ME.txt dist/AuroraBricks-XEX-Bringup/READ_ME.txt
          ( cd dist && zip -r ../AuroraBricks-XEX-Bringup.zip AuroraBricks-XEX-Bringup )
          ls -l dist/AuroraBricks-XEX-Bringup

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuroraBricks-XEX-Bringup
          path: AuroraBricks-XEX-Bringup.zip
