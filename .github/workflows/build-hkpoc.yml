name: build-hkpoc (sprite PoC ELF)

# Builds the Hollow-Knight sprite PoC as a bare-metal Xbox 360 ELF with libXenon.
#
# The PoC binary contains NO game assets: at runtime it mounts a FAT32 USB stick
# and loads a .spr the user extracted from their own LOCAL game install. The
# artifact uploaded here is therefore asset-free code only.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-hkpoc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull libXenon Docker image
        run: docker pull free60/libxenon:latest

      - name: Build with libXenon
        run: |
          docker run --rm -v "$PWD":/app -w /app free60/libxenon:latest \
            bash -lc 'set -e; echo "DEVKITXENON=$DEVKITXENON"; make -C poc'

      - name: Verify the output is a genuine PPC ELF (not a host binary)
        run: |
          set -e
          BIN=poc/hk_sprite_poc.elf32
          test -f "$BIN"
          file "$BIN" | tee /tmp/file.txt
          grep -q "ELF 32-bit" /tmp/file.txt
          grep -qE "PowerPC|PPC" /tmp/file.txt
          readelf -h "$BIN" | tee /tmp/elf.txt
          grep -qE "PowerPC" /tmp/elf.txt
          if grep -qE "x86-64|Intel 80386|Advanced Micro" /tmp/elf.txt; then
            echo "::error::Output is an x86 host binary, not a 360 ELF"; exit 1
          fi
          echo "OK: $(stat -c %s "$BIN") bytes"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HK-Sprite-PoC
          path: poc/hk_sprite_poc.elf32
