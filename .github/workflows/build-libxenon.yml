name: build-libxenon (playable ELF)

# Builds the game as a bare-metal Xbox 360 ELF with the open-source libXenon
# toolchain, inside the official free60/libxenon Docker image. The result,
# AuroraBricks.elf, launches from Aurora's File Manager (or XeLL).

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-libxenon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull libXenon Docker image
        run: docker pull free60/libxenon:latest

      - name: Build with libXenon
        run: |
          docker run --rm -v "$PWD":/app -w /app free60/libxenon:latest \
            bash -lc 'set -e; echo "DEVKITXENON=$DEVKITXENON"; make -C xenon'

      - name: Verify the output is a genuine PPC ELF (not a host binary)
        run: |
          set -e
          BIN=xenon/aurora_bricks.elf32
          test -f "$BIN"
          file "$BIN" | tee /tmp/file.txt
          grep -q "ELF 32-bit" /tmp/file.txt
          grep -qE "PowerPC|PPC" /tmp/file.txt
          readelf -h "$BIN" | tee /tmp/elf.txt
          grep -qE "PowerPC" /tmp/elf.txt
          # Explicitly reject an accidental x86/host build.
          if grep -qE "x86-64|Intel 80386|Advanced Micro" /tmp/elf.txt; then
            echo "::error::Output is an x86 host binary, not a 360 ELF"; exit 1
          fi
          echo "OK: $(stat -c %s "$BIN") bytes"

      - name: Package Aurora bundle
        run: |
          set -e
          mkdir -p dist/AuroraBricks
          cp xenon/aurora_bricks.elf32 dist/AuroraBricks/AuroraBricks.elf
          cp packaging/AuroraBricks-libxenon-READ_ME.txt dist/AuroraBricks/READ_ME.txt
          ls -l dist/AuroraBricks

      # Upload the directory (not a pre-made .zip) so the downloaded artifact
      # isn't double-zipped: it contains AuroraBricks.elf and READ_ME.txt.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuroraBricks-libxenon
          path: dist/AuroraBricks
